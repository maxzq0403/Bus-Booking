<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ระบบจองที่นั่ง 🚌</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
}

h1 {
  background: #333;
  color: white;
  padding: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 80px);
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
}

.seat {
  padding: 20px;
  border-radius: 10px;
  cursor: pointer;
  color: white;
}

.empty {
  background: green;
}

.booked {
  background: red;
}
</style>
</head>
<body>

<h1>ระบบจองที่นั่ง 🚌</h1>

<div class="grid" id="grid"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwtrngwK_TVfzdcpKLXuvD9KMgH-cOmTgF_foV5M8aGX16x5mSfgGdwTA0kT38inSV0/exec";

async function loadSeats() {
  const res = await fetch(API_URL);
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  data.forEach(seat => {
    const div = document.createElement("div");
    div.className = "seat " + seat.status;
    div.innerText = seat.seat;

    div.onclick = async () => {
      if (seat.status === "booked") {
        alert("ที่นั่งนี้ถูกจองโดย: " + seat.name);
        return;
      }

      const name = prompt("กรอกชื่อ:");
      if (!name) return;

      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          seat: seat.seat,
          name: name
        })
      });

      const result = await res.json();

      if (result.success) {
        alert("จองสำเร็จ!");
        loadSeats();
      } else {
        alert("จองไม่สำเร็จ มีคนจองไปแล้ว");
        loadSeats();
      }
    };

    grid.appendChild(div);
  });
}

loadSeats();
setInterval(loadSeats, 3000);
</script>

</body>
</html>
