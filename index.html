<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ระบบจองที่นั่ง 🚌</title>

<style>
body { font-family: sans-serif; text-align: center; }

h1 { background: #333; color: white; padding: 10px; }

.grid {
  display: grid;
  grid-template-columns: repeat(2, 150px);
  gap: 15px;
  justify-content: center;
  margin-top: 20px;
}

.seat {
  padding: 25px;
  border-radius: 10px;
  cursor: pointer;
  color: white;
  font-weight: bold;
}

.empty { background: green; }
.booked { background: red; }

/* popup */
#popup {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.5);
}

.popup-box {
  background:white;
  padding:20px;
  margin:100px auto;
  width:250px;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>ระบบจองที่นั่ง 🚌</h1>
<div class="grid" id="grid"></div>

<div id="popup" style="display:none;">
  <div class="popup-box">
    <h3 id="seatTitle"></h3>
    <input id="name1" placeholder="ชื่อคุณ"><br><br>
    <input id="name2" placeholder="ชื่อเพื่อน"><br><br>
    <button onclick="confirmBooking()">ยืนยัน</button>
    <button onclick="closePopup()">ยกเลิก</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxYz9HpIQx-kgKxkzGlM_LFXna5ZkEVqMNsV6qwUFqWmQTqx3rWFpK2sMOZtnv3CUaB1A/exec";

let selectedSeat = null;

async function loadSeats() {
  const res = await fetch(API_URL + "?t=" + Date.now());
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  data.forEach(seat => {
    const div = document.createElement("div");
    div.className = "seat " + seat.status;
    div.innerText = seat.seat;

    div.onclick = () => {
      if (seat.status === "booked") {
        alert("จองแล้ว:\n" + seat.name1 + " + " + seat.name2);
        return;
      }

      selectedSeat = seat.seat;
      document.getElementById("seatTitle").innerText = "จองที่นั่ง " + seat.seat;
      document.getElementById("popup").style.display = "block";
    };

    grid.appendChild(div);
  });
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

async function confirmBooking() {
  const name1 = document.getElementById("name1").value;
  const name2 = document.getElementById("name2").value;

  if (!name1 || !name2) return;

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      seat: selectedSeat,
      name1: name1,
      name2: name2
    })
  });

  const result = await res.json();

  if (result.success) {
    alert("จองสำเร็จ!");
  } else {
    alert("มีคนจองไปแล้ว");
  }

  closePopup();
  loadSeats();
}

loadSeats();
setInterval(loadSeats, 1000);
</script>

</body>
</html>
